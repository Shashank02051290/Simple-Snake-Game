<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        #gameCanvas {
            background: #0a0a1a;
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            display: block;
            width: 100%;
            height: auto;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .score {
            color: #00ff88;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .high-score {
            color: #ffd700;
            font-size: 1rem;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .screen.hidden {
            display: none;
        }

        h1 {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        h2 {
            color: #ff6b6b;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #fff;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            max-width: 300px;
        }

        .instructions p {
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .final-score {
            color: #ffd700;
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 10px;
            color: #00ff88;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:active {
            background: rgba(0, 255, 136, 0.4);
            transform: scale(0.95);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            max-width: 200px;
            margin: 0 auto;
        }

        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        @media (max-width: 600px) {
            .mobile-controls {
                display: block;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="mobile-controls">
            <div class="controls-grid">
                <button class="control-btn up" id="btnUp">↑</button>
                <button class="control-btn left" id="btnLeft">←</button>
                <button class="control-btn right" id="btnRight">→</button>
                <button class="control-btn down" id="btnDown">↓</button>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div class="screen" id="startScreen">
            <h1>🐍 Snake Game</h1>
            <div class="instructions">
                <p>🎮 Use arrow keys or WASD to control the snake</p>
                <p>📱 On mobile, use the touch controls below</p>
                <p>🍎 Eat the red food to grow and score points</p>
                <p>💀 Don't hit the walls or yourself!</p>
            </div>
            <button class="btn" id="startBtn">Start Game</button>
        </div>
        
        <!-- Game Over Screen -->
        <div class="screen hidden" id="gameOverScreen">
            <h2>Game Over!</h2>
            <p>Your Score:</p>
            <div class="final-score" id="finalScore">0</div>
            <p id="newHighScore" style="color: #ffd700; display: none;">🎉 New High Score! 🎉</p>
            <button class="btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const newHighScoreElement = document.getElementById('newHighScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // Mobile controls
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        
        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let speed = 150; // milliseconds per move
        
        // Game state
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;
        
        // Snake
        let snake = [];
        let snakeLength = 3;
        
        // Food
        let foodX = 10;
        let foodY = 10;
        
        // Direction
        let xVelocity = 0;
        let yVelocity = 0;
        let nextXVelocity = 0;
        let nextYVelocity = 0;
        
        // Particles for effects
        let particles = [];
        
        // Audio context for sound effects
        let audioContext;
        
        // Initialize high score display
        highScoreElement.textContent = highScore;
        
        // Initialize audio
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // Play sound effect
        function playSound(frequency, type = 'sine', duration = 0.1) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        // Initialize game
        function initGame() {
            // Reset snake
            snake = [];
            snakeLength = 3;
            
            // Starting position
            for (let i = snakeLength - 1; i >= 0; i--) {
                snake.push({
                    x: i,
                    y: Math.floor(tileCount / 2)
                });
            }
            
            // Reset direction
            xVelocity = 1;
            yVelocity = 0;
            nextXVelocity = 1;
            nextYVelocity = 0;
            
            // Reset score
            score = 0;
            scoreElement.textContent = score;
            
            // Place food
            placeFood();
            
            // Clear particles
            particles = [];
            
            // Set game running
            gameRunning = true;
            
            // Start game loop
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, speed);
        }
        
        // Place food at random position
        function placeFood() {
            // Generate random position
            let newFoodX, newFoodY;
            let validPosition = false;
            
            while (!validPosition) {
                newFoodX = Math.floor(Math.random() * tileCount);
                newFoodY = Math.floor(Math.random() * tileCount);
                
                // Check if food is not on snake
                validPosition = true;
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === newFoodX && snake[i].y === newFoodY) {
                        validPosition = false;
                        break;
                    }
                }
            }
            
            foodX = newFoodX;
            foodY = newFoodY;
        }
        
        // Create particles
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x * gridSize + gridSize / 2,
                    y: y * gridSize + gridSize / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        // Update particles
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= 0.05;
                
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // Draw particles
        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        // Game step
        function gameStep() {
            if (!gameRunning) return;
            
            // Update direction from next direction
            xVelocity = nextXVelocity;
            yVelocity = nextYVelocity;
            
            // Move snake
            const head = {
                x: snake[0].x + xVelocity,
                y: snake[0].y + yVelocity
            };
            
            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === foodX && head.y === foodY) {
                // Increase score
                score += 10;
                scoreElement.textContent = score;
                
                // Create particles
                createParticles(foodX, foodY, '#ff6b6b', 15);
                
                // Play eat sound
                playSound(440, 'sine', 0.1);
                setTimeout(() => playSound(660, 'sine', 0.1), 50);
                
                // Place new food
                placeFood();
                
                // Increase speed slightly
                if (speed > 50) {
                    speed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, speed);
                }
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
            
            // Update particles
            updateParticles();
            
            // Draw everything
            draw();
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid (subtle)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                foodX * gridSize + gridSize / 2,
                foodY * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw snake
            snake.forEach((segment, index) => {
                // Gradient from head to tail
                const gradient = ctx.createLinearGradient(
                    snake[0].x * gridSize,
                    snake[0].y * gridSize,
                    snake[snake.length - 1].x * gridSize,
                    snake[snake.length - 1].y * gridSize
                );
                gradient.addColorStop(0, '#00ff88');
                gradient.addColorStop(1, '#00cc6a');
                
                ctx.fillStyle = gradient;
                
                // Draw rounded segment
                const radius = 5;
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;
                const size = gridSize - 2;
                
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + size - radius, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
                ctx.lineTo(x + size, y + size - radius);
                ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
                ctx.lineTo(x + radius, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();
                
                // Draw eyes on head
                if (index === 0) {
                    ctx.fillStyle = '#000';
                    const eyeSize = 3;
                    let eye1X, eye1Y, eye2X, eye2Y;
                    
                    // Position eyes based on direction
                    if (xVelocity === 1) { // Right
                        eye1X = x + 12;
                        eye1Y = y + 5;
                        eye2X = x + 12;
                        eye2Y = y + 12;
                    } else if (xVelocity === -1) { // Left
                        eye1X = x + 6;
                        eye1Y = y + 5;
                        eye2X = x + 6;
                        eye2Y = y + 12;
                    } else if (yVelocity === -1) { // Up
                        eye1X = x + 5;
                        eye1Y = y + 6;
                        eye2X = x + 12;
                        eye2Y = y + 6;
                    } else { // Down
                        eye1X = x + 5;
                        eye1Y = y + 12;
                        eye2X = x + 12;
                        eye2Y = y + 12;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Draw particles
            drawParticles();
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            // Play game over sound
            playSound(220, 'square', 0.3);
            setTimeout(() => playSound(165, 'square', 0.3), 100);
            
            // Check for new high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
                newHighScoreElement.style.display = 'block';
            } else {
                newHighScoreElement.style.display = 'none';
            }
            
            // Show game over screen
            finalScoreElement.textContent = score;
            gameOverScreen.classList.remove('hidden');
            
            // Add shake animation to canvas
            canvas.style.animation = 'shake 0.5s';
            setTimeout(() => {
                canvas.style.animation = '';
            }, 500);
        }
        
        // Add shake animation to CSS
        const shakeKeyframes = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        const styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.innerText = shakeKeyframes;
        document.head.appendChild(styleSheet);
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            // Prevent arrow keys from scrolling the page
            if ([37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // Arrow keys
            switch (e.keyCode) {
                case 37: // Left arrow
                    if (xVelocity !== 1) {
                        nextXVelocity = -1;
                        nextYVelocity = 0;
                    }
                    break;
                case 38: // Up arrow
                    if (yVelocity !== 1) {
                        nextXVelocity = 0;
                        nextYVelocity = -1;
                    }
                    break;
                case 39: // Right arrow
                    if (xVelocity !== -1) {
                        nextXVelocity = 1;
                        nextYVelocity = 0;
                    }
                    break;
                case 40: // Down arrow
                    if (yVelocity !== -1) {
                        nextXVelocity = 0;
                        nextYVelocity = 1;
                    }
                    break;
            }
            
            // WASD keys
            switch (e.key.toLowerCase()) {
                case 'a':
                    if (xVelocity !== 1) {
                        nextXVelocity = -1;
                        nextYVelocity = 0;
                    }
                    break;
                case 'w':
                    if (yVelocity !== 1) {
                        nextXVelocity = 0;
                        nextYVelocity = -1;
                    }
                    break;
                case 'd':
                    if (xVelocity !== -1) {
                        nextXVelocity = 1;
                        nextYVelocity = 0;
                    }
                    break;
                case 's':
                    if (yVelocity !== -1) {
                        nextXVelocity = 0;
                        nextYVelocity = 1;
                    }
                    break;
            }
        });
        
        // Mobile touch controls
        btnUp.addEventListener('click', () => {
            if (gameRunning && yVelocity !== 1) {
                nextXVelocity = 0;
                nextYVelocity = -1;
            }
        });
        
        btnDown.addEventListener('click', () => {
            if (gameRunning && yVelocity !== -1) {
                nextXVelocity = 0;
                nextYVelocity = 1;
            }
        });
        
        btnLeft.addEventListener('click', () => {
            if (gameRunning && xVelocity !== 1) {
                nextXVelocity = -1;
                nextYVelocity = 0;
            }
        });
        
        btnRight.addEventListener('click', () => {
            if (gameRunning && xVelocity !== -1) {
                nextXVelocity = 1;
                nextYVelocity = 0;
            }
        });
        
        // Touch swipe controls
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            // Check if swipe is significant
            if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                // Determine swipe direction
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Horizontal swipe
                    if (diffX > 0 && xVelocity !== -1) {
                        nextXVelocity = 1;
                        nextYVelocity = 0;
                    } else if (diffX < 0 && xVelocity !== 1) {
                        nextXVelocity = -1;
                        nextYVelocity = 0;
                    }
                } else {
                    // Vertical swipe
                    if (diffY > 0 && yVelocity !== -1) {
                        nextXVelocity = 0;
                        nextYVelocity = 1;
                    } else if (diffY < 0 && yVelocity !== 1) {
                        nextXVelocity = 0;
                        nextYVelocity = -1;
                    }
                }
            }
        });
        
        // Start button
        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.classList.add('hidden');
            initGame();
        });
        
        // Restart button
        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });
        
        // Initial draw
        draw();
    </script>
</body>
</html>
